<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publish All — Travel Antalya Admin</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { max-width: 560px; margin: 60px auto; padding: 0 24px; }
  #status { margin-top: 20px; padding: 16px 20px; border-radius: 8px; background: var(--bg-tint); font-size: 0.92rem; white-space: pre-wrap; }
  #loginBox { margin-top: 20px; }
</style>
</head>
<body>
  <h1>Publish All Drafts</h1>
  <p>This merges every waiting draft (from the Editorial Workflow board) into the live site in one go, then triggers a single deploy.</p>

  <div id="loginBox">
    <p>You need to be logged in to use this.</p>
    <button class="btn btn-blue" onclick="netlifyIdentity.open('login')">Log In</button>
  </div>

  <button id="publishBtn" class="btn btn-orange" style="display:none;" onclick="publishAll()">Publish All Drafts Now</button>
  <div id="status" style="display:none;"></div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    function updateUI() {
      const user = netlifyIdentity.currentUser();
      document.getElementById('loginBox').style.display = user ? 'none' : 'block';
      document.getElementById('publishBtn').style.display = user ? 'inline-flex' : 'none';
    }

    netlifyIdentity.on('init', updateUI);
    netlifyIdentity.on('login', updateUI);
    netlifyIdentity.on('logout', updateUI);
    netlifyIdentity.init();

    async function publishAll() {
      const statusEl = document.getElementById('status');
      statusEl.style.display = 'block';
      statusEl.textContent = 'Publishing…';

      const user = netlifyIdentity.currentUser();
      const token = await user.jwt();

      try {
        const res = await fetch('/.netlify/functions/publish-all', {
          headers: { Authorization: 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = 'Error: ' + (data.error || 'Unknown error') + (data.detail ? '\n' + data.detail : '');
          return;
        }
        let text = data.message + '\n';
        if (data.merged && data.merged.length) text += '\nPublished:\n' + data.merged.join('\n');
        if (data.failed && data.failed.length) text += '\n\nFailed:\n' + data.failed.map(f => f.branch).join('\n');
        statusEl.textContent = text;
      } catch (e) {
        statusEl.textContent = 'Request failed: ' + e;
      }
    }
  </script>
</body>
</html>
